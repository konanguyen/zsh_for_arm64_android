name: Build module

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Makefile picks the NDK up from this variable (NDK ?= ...).
      NDK: ${{ github.workspace }}/android-ndk-r29
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Restore cached Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: android-ndk-r29
          key: android-ndk-r29-linux

      - name: Download Android NDK r29
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip

      - name: Build the module
        run: make

      # Magisk app checks module.prop's updateJson for in-app updates; the
      # zip/changelog URLs use the fixed "latest release" asset paths so the
      # file never needs manual editing between releases.
      - name: Generate update.json
        run: |
          VERSION=$(sed -n 's/^version=//p' module.prop)
          jq -n \
            --arg v "$VERSION" \
            --arg c "$(sed -n 's/^versionCode=//p' module.prop)" \
            '{version: $v,
              versionCode: ($c | tonumber),
              zipUrl: ("https://github.com/konanguyen/zsh_for_arm64_android/releases/latest/download/zsh_arm64-" + $v + ".zip"),
              changelog: "https://raw.githubusercontent.com/konanguyen/zsh_for_arm64_android/master/changelog.md"}' > update.json
          cat update.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zsh_arm64-module
          path: |
            out/*.zip
            update.json
          if-no-files-found: error

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            update.json
          generate_release_notes: true
